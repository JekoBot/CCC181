services:
  db:
    image: postgres:17
    container_name: uniformq-db
    environment:
      POSTGRES_USER: uniformq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uniformq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniformq -d uniformq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: